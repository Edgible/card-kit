# Build the edgible-mcp image, for amd64 and arm64, whenever edgible-mcp/ changes. On main it
# is published as ghcr.io/edgible-org/edgible-mcp:<version in package.json>, which the
# edgible-mcp card in edgible-org/cards runs. A published version is never overwritten: a change
# to the image needs a new version in package.json and in server.mjs.

name: mcp-image

on:
  pull_request:
    paths:
      - edgible-mcp/**
      - .github/workflows/mcp-image.yml
  push:
    branches: [main]
    paths:
      - edgible-mcp/**
      - .github/workflows/mcp-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/edgible-org/edgible-mcp

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          version=$(jq -r .version edgible-mcp/package.json)
          grep -q "version: '$version'" edgible-mcp/server.mjs \
            || { echo "::error::server.mjs does not say version $version, as package.json does"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: A changed image needs a new version
        if: github.event_name == 'pull_request' && steps.v.outputs.published == 'true'
        run: echo "::warning::$IMAGE:${{ steps.v.outputs.version }} is already published. Raise the version in package.json and server.mjs, or main will not publish this change."

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && steps.v.outputs.published == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: edgible-mcp
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.v.outputs.published == 'false' }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
