- category: Internet of Things (IoT)
  jobs: [home automation, control my smart home from anywhere, one app for all my smart devices, keep my smart home working without the cloud]
  replaces: [SmartThings, Google Home, Alexa routines, vendor cloud apps]
  drivers: [local, privacy, control, shut-down]
  fit: {rating: conditional, why: "it must run on a machine at home, on the same network as the devices; reaching it from outside without opening router ports is where Edgible helps"}
  exposure:
    default: org for the web interface; the companion phone apps cannot pass an Edgible sign-in, so they need the app's own login on a hostname without one
    sensitive: org only, and the phone apps at home
