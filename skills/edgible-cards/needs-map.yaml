- category: Games
  jobs: [a Minecraft server for my friends, host a game server for my group, a game server my kids can join from PC and phone]
  replaces: [Minecraft Realms, rented game servers]
  drivers: [cost, control]
  fit: {rating: conditional, why: "game servers are tcp or udp apps, which Edgible publishes on ports 20000 to 29999 with no auth mode; the game's own whitelist decides who gets in"}
  exposure:
    default: tcp or udp with no auth mode, and the game's whitelist on (the minecraft starter)
    sensitive: n/a
  machine: CPU and memory grow with players; always on while people play
  starters: [minecraft]
  cards: []
  ask: ["which game, and Java or Bedrock players?", "how many players?"]

