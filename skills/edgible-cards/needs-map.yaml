# The needs map: from what a person says they need to a self-hosted answer on Edgible.
#
# People describe a need ("somewhere private for my photos"), not an app. Each entry is one
# awesome-selfhosted category (https://github.com/awesome-selfhosted/awesome-selfhosted-data,
# tags/), with what only people know about it:
#
#   category   the category's exact name: line in awesome-selfhosted tags/
#   jobs       how people say the need, in their words. Match on these, not on the category name.
#   replaces   hosted services people leave for it. A product name is the strongest signal.
#   drivers    why people self-host it, strongest first: cost, privacy, control, shut-down
#              (a service that closed or got worse), compliance, local (must run at home)
#   fit        good, conditional, poor, or refused, for Edgible: a machine you control, at home,
#              in the office, or a small cloud server in your own account, published
#              through Edgible's gateway. why says what decides it.
#   exposure   how to publish it. default is the usual choice. sensitive is for when the person
#              says the data is private or sensitive.
#   machine    what the machine needs beyond Docker
#   cards      Edgible cards for it (github.com/Edgible/cards): app cards first, then patterns
#   ask        the one or two questions whose answers change the recommendation
#
# Optional:
#   source     edgible for a category Edgible added because awesome-selfhosted has none for
#              it yet, mostly AI tools, which move faster than a curated list. category is
#              then Edgible's own name. Leave it out for an awesome-selfhosted category.
#   find       where to shortlist apps when awesome-selfhosted has few or none: required with
#              source edgible
#   exposure.regulated  for regulated or confidential data: health records, legal privilege,
#                       client files, financial records, children's data
#   permissions         who sees what inside the app, beyond who reaches it
#   builders            how a founder or developer uses it as a building block for a product
#
# Apps are not listed: the skill's Choose an app step ranks them from awesome-selfhosted's data,
# or from the entry's find sources, so they stay current. Cards are hints. Find lists the current ones.
#
# Where Edgible ends TLS, and what its gateway can see, is in Edgible's docs. Link to them
# when someone asks. Do not state it from memory.

- category: Bookmarks and Link Sharing
  jobs: [save articles to read later, keep bookmarks across browsers and devices, archive web pages before they disappear, share links with my team]
  replaces: [Pocket, Raindrop.io, Instapaper, Pinboard, Omnivore]
  drivers: [shut-down, privacy, cost]
  fit: {rating: good, why: small, and works well behind a login}
  exposure:
    default: web interface on org; browser extensions and phone apps cannot pass an Edgible sign-in, so their hostname is none with the app's own login, or api-key if the app's clients can send a header
    sensitive: org only, and save from the browser at home
  machine: little; page archiving needs disk
  cards: [linkding]
  ask: ["read later with saved page copies, or just links?", "do you save from a phone?"]

- category: Photo Galleries
  jobs: [back up my phone photos, a private place for family photos, keep sensitive photos off the cloud, search my photos by face or place]
  replaces: [Google Photos, iCloud Photos, Amazon Photos, Flickr]
  drivers: [privacy, cost, control]
  fit: {rating: conditional, why: "good with enough disk and a backup plan; photos are irreplaceable, so the backup is not optional"}
  exposure:
    default: none, with the app's own login, because phone backup apps cannot pass an Edgible sign-in (the immich card does this)
    sensitive: "offer three: not published (back up on home Wi-Fi only), org for the web with phone uploads at home, or none with a strong login and prompt updates. Add disk encryption and an encrypted off-site backup."
    regulated: "photos of patients, clients, or children carry legal duties: a prototype with consented or test photos only; real data needs compliant hosting and advice"
  permissions: "albums and partner sharing decide which family members see which photos; check sharing defaults before inviting people"
  builders: "a photo store with face and place search, for a product prototype that works with people's photos"
  machine: lots of disk (library plus about 20% for thumbnails); 6 GB memory for Immich; a GPU helps face search but is optional
  cards: [immich]
  ask: ["how sensitive are they, and do you need them away from home?", "how much space does your library take?"]

- category: File Transfer & Synchronization
  jobs: [sync files between my computers, a private Dropbox, share folders with family or a team, keep documents off the cloud]
  replaces: [Dropbox, Google Drive, OneDrive, Box, iCloud Drive]
  drivers: [privacy, cost, control]
  fit: {rating: conditional, why: "works, but sync clients need the app's own login, and the files need a backup"}
  exposure:
    default: none with the app's own login, because desktop and phone sync clients cannot pass an Edgible sign-in
    sensitive: org for the web only, or not published and synced on the home network
    regulated: "client or patient files need the firm's or practice's rules on where data may be held; a machine you control can suit, with access rules, backups, and advice; a cloud server in the firm's own account and an allowed region often suits better than an office PC"
  permissions: "shared folders and groups decide who sees which files; set them per team or client"
  machine: disk for every synced file, and a backup
  cards: []
  ask: ["sync to desktop and phone, or a web folder is enough?", "who shares it?"]

- category: Password Managers
  jobs: [share passwords with my team or family, stop keeping passwords in a spreadsheet, a password manager I control]
  replaces: [1Password, LastPass, Bitwarden cloud, Dashlane]
  drivers: [control, cost, privacy]
  fit: {rating: conditional, why: "the stakes are high: losing the server or its backup locks everyone out; a hosted manager is often the safer choice for people who will not run backups"}
  exposure:
    default: none with the app's own login and two-factor, because browser extensions and phone apps cannot pass an Edgible sign-in (the vaultwarden card)
    sensitive: the same, with registration closed, two-factor required, and tested backups
  machine: little; an always-on machine and a backup are essential
  cards: [vaultwarden]
  ask: ["who will check that backups work?"]

- category: Booking and Scheduling
  jobs: [members book our courts or rooms, schedule games or matches, arrange a time that suits everyone, let customers book appointments with us]
  replaces: [court booking apps, Calendly, Doodle, Google Calendar booking pages]
  drivers: [cost, control]
  fit: {rating: conditional, why: "works well, but a club or community depends on it: it needs a machine that stays on, usually a small cloud server rather than a volunteer's computer, and someone besides one volunteer to look after it"}
  exposure:
    default: none with the app's own member accounts, because members and customers are not in your Edgible organization; sign-up closed or approved by an admin
    sensitive: the same; members' contact details stay in the app
  permissions: "admins set booking rules, such as length, how far ahead, and who may book which resource"
  machine: always on, so usually a small cloud server; little else
  cards: []
  ask: ["who looks after it when you step down?", "a home machine, or a small cloud server at a few dollars a month? and do bookings need payment?"]

- category: Analytics
  jobs: [see who visits my website, stop paying for analytics, analytics without cookies or a consent banner, GDPR-friendly analytics]
  replaces: [Google Analytics, Plausible cloud, Fathom, Simple Analytics]
  drivers: [privacy, compliance, cost]
  fit: {rating: good, why: small and well suited}
  exposure:
    default: dashboard on org; the tracking script on none, because every visitor's browser loads it (the umami card)
    sensitive: the same
  machine: little
  cards: [umami, website]
  ask: ["one site or several?"]

- category: Content Management Systems (CMS)
  jobs: [cheaper hosting for my business website, edit my website without a developer, a website with members or restricted content, move off Squarespace or Wix]
  replaces: [Squarespace, Wix, WordPress.com, managed WordPress hosting]
  drivers: [cost, control]
  fit: {rating: conditional, why: "good for a CMS on a machine that stays on, usually a small cloud server; a static site is better on free static hosting; a site that earns money needs someone to keep it up"}
  exposure:
    default: the site on none; its editor or admin on org where the app allows a separate hostname
    sensitive: n/a, a website is public
  machine: always on, with a reliable connection, so usually a small cloud server
  cards: [wordpress, website, accounts]
  ask: ["is the site static, or edited in a CMS?", "does it have members or paid content?"]

- category: Blogging Platforms
  jobs: [start a blog or newsletter, a blog with paid members, leave Substack or Medium]
  replaces: [Substack, Medium, Ghost(Pro), Beehiiv]
  drivers: [control, cost]
  fit: {rating: good, why: "fine on a machine that stays on, such as a small cloud server; newsletters need an outside email sending service"}
  exposure:
    default: the blog on none, the admin behind the app's own login
    sensitive: n/a, a blog is public
  machine: always on
  cards: []
  ask: ["newsletter emails too?", "paid members?"]

- category: Static Site Generators
  jobs: [a simple website with no logins, a documentation site, a portfolio]
  replaces: [Squarespace, Wix, GitHub Pages]
  drivers: [cost, control]
  fit: {rating: poor, why: "a static site is usually best on free static hosting (Cloudflare Pages, Netlify, GitHub Pages), with no machine to keep up; self-host it only if the person wants it on their own machine"}
  exposure:
    default: none
    sensitive: n/a
  machine: n/a
  cards: [website]
  ask: ["does anything need a login or an editor?"]

- category: Federated Identity & Authentication
  jobs: [add sign-in to my site or app, members sign-up and login, one login for my apps, keep my user list myself]
  replaces: [Auth0, Clerk, AWS Cognito, Firebase Auth]
  drivers: [control, cost, privacy]
  fit: {rating: conditional, why: "works well for apps you build; the sign-in service must stay up, or nobody can log in"}
  exposure:
    default: sign-in pages on none, the admin console on org (the accounts card)
    sensitive: the same, with the admin console on org only
  permissions: "roles and organizations in the identity app decide what each signed-in person may see; the content must be served by something that checks them"
  builders: "sign-up, sign-in, and a user list for a product prototype, kept on a machine you control"
  machine: always on
  cards: [accounts]
  ask: ["who signs in: people you invite, or the public?", "is the content served by something that checks the sign-in?"]

- category: Wikis
  jobs: [a team wiki, document how we do things, a knowledge base for customers, leave Notion or Confluence]
  replaces: [Notion, Confluence, Slab, GitBook]
  drivers: [cost, control, privacy]
  fit: {rating: good, why: small and well suited}
  exposure:
    default: org for a team wiki; none for a public knowledge base
    sensitive: org
    regulated: "org, with the app's roles restricting confidential pages; keep client-identifying detail out of pages everyone can read"
  permissions: "books, spaces, or page roles decide who reads and edits what; set them before importing confidential material"
  builders: "a documentation or help centre for a product"
  machine: little
  cards: []
  ask: ["for your team, or public?"]

- category: Knowledge Management Tools
  jobs: [help new staff learn what we know, a searchable library of our past work and best practices, onboarding for new people, turn our documents into answers]
  replaces: [Guru, Notion, Confluence, SharePoint, legal and professional knowledge platforms]
  drivers: [privacy, control, cost]
  fit: {rating: good, why: "internal users suit org exactly; confidential material is the strongest reason to keep it on a machine you control, in the office or a cloud server in the firm's own account"}
  exposure:
    default: org
    sensitive: org
    regulated: "org, with the app's permissions matching who may see which material, such as matters or clients; cite sources and keep a person checking answers"
  permissions: "need-to-know rules, such as a law firm's ethical walls, are set in the app's groups; Edgible's org only decides who is in the team"
  builders: "a knowledge base behind a product's help or onboarding"
  machine: disk for the library; memory for search, and much more when a local AI model answers questions (see the GenAI entry)
  cards: [assistant]
  ask: ["roughly how much material, and in what formats?", "must some people be kept from some material?"]

- category: Note-taking & Editors
  jobs: [private notes I can reach anywhere, shared notes with family or a team, markdown notes on my own server]
  replaces: [Evernote, Notion, Google Keep, OneNote]
  drivers: [privacy, control, cost]
  fit: {rating: good, why: small; phone apps decide the auth mode}
  exposure:
    default: org for the web; none with the app's login when its phone app must sync
    sensitive: org, or not published
  machine: little
  cards: []
  ask: ["do you need a phone app?"]

- category: Document Management
  jobs: [scan and organise paper documents, go paperless, search my invoices and letters, edit and convert PDFs privately]
  replaces: [Evernote scanning, Adobe Acrobat online, online PDF tools]
  drivers: [privacy, control]
  fit: {rating: good, why: "documents are often sensitive, which suits a machine you control"}
  exposure:
    default: org
    sensitive: org, or not published
    regulated: "documents with client, patient, or financial data: org, with the app's per-user or per-group permissions, encrypted backups, and the person's professional rules on retention"
