- category: Automation
  jobs: [connect my apps together, automate workflows without Zapier, run AI workflows on my own data]
  replaces: [Zapier, Make, IFTTT]
  drivers: [cost, privacy, control]
  fit: {rating: good, why: "fits well; webhooks from other services need their own open path"}
  exposure:
    default: the editor on org; webhook paths on none, because the services calling them cannot sign in
    sensitive: org, with webhooks only where needed
  machine: always on
  cards: [n8n]
  ask: ["do other services need to call it with webhooks?"]

- category: Generative Artificial Intelligence (GenAI)
  jobs: [chat with AI privately, ask questions about my own documents, run AI models without sending data away, one API for several models, run open models on my own GPU and use them from anywhere, an OpenAI-compatible API for my own apps]
  replaces: [ChatGPT, Claude.ai for private documents, hosted LLM APIs]
  drivers: [privacy, cost, control]
  fit: {rating: conditional, why: "local models need a strong machine and answer slower than hosted ones; small models run on CPU"}
  exposure:
    default: the chat on org; the model API on api-key
    sensitive: org and api-key only
    regulated: "keeping documents and prompts off outside AI services is a strong reason to run models locally; still check the professional rules, have answers cite their source, and have a person check them before relying on them"
  permissions: "knowledge bases and groups decide which documents each person's questions can draw on; with need-to-know rules, such as a law firm's ethical walls, one shared knowledge base is wrong"
  builders: "a private model and document chat for a prototype, so early users' data does not go to an outside AI service"
  machine: much memory; a GPU or Apple Silicon for anything but small models
  cards: [assistant, litellm]
  find: "awesome-selfhosted lists only a few; also GitHub repositories tagged local-llm or llm-inference, most starred and recently updated"
  ask: ["what hardware do you have?", "chat, documents, or an API for your own apps?"]

- category: AI tools for assistants (MCP servers)
  source: edgible
  jobs: [let Claude or ChatGPT use my files or database, use my MCP server when I'm away from my desk, share an MCP server with my team, give my AI assistant access to our internal tools, host the MCP server I built]
  replaces: [hosted MCP platforms, Zapier MCP, keeping the server on one laptop]
  drivers: [privacy, control, local]
  fit: {rating: good, why: "an MCP server is a small web service next to the data it reaches, which is what Edgible publishes; what decides it is how the person's assistant signs in"}
  exposure:
    default: "api-key, which clients that can send a header use (Claude Code and most developer tools: Authorization: Bearer); Claude's desktop and web connectors expect the server's own OAuth instead, so check the client's current docs before choosing"
    sensitive: api-key, with read-only tools unless writes are needed, and one key per person so a key can be revoked; never none without the server's own sign-in
  permissions: "every tool the server offers is something the assistant can do with the person's data; offer read-only tools first, and ask before tools that change or delete things"
  builders: "the quickest way to let early users try an MCP server: publish it from the developer's machine or a small cloud server, without building hosting"
  machine: "next to the data or tools it reaches; always on if others use it. Most packaged servers speak stdio, so publishing one needs a bridge container that serves it over Streamable HTTP; a server that already speaks HTTP needs none"
  cards: [mcp-bridge]
  find: "the official MCP Registry (https://registry.modelcontextprotocol.io/v0/servers?search=<word>): servers listed with packages run on your own machine and are the ones to publish, servers with only remotes are already hosted; also GitHub repositories tagged mcp-server"
  ask: ["which assistant will connect to it: Claude Code, Claude's apps, or something else?", "should it only read, or also change things?"]

- category: Vector databases and AI search
  source: edgible
  jobs: [a vector database for my RAG app, semantic search over our documents, store embeddings without paying per query, memory for my AI agent]
  replaces: [Pinecone, Weaviate Cloud, Zilliz Cloud, Qdrant Cloud]
  drivers: [cost, privacy, control]
  fit: {rating: good, why: "fits well when the app using it is elsewhere; when it runs on the same machine, it need not be published at all"}
  exposure:
    default: "not published when only an app on the same machine uses it; otherwise its API on api-key, and its admin dashboard, if any, on org"
    sensitive: not published, or api-key only; embeddings can reveal the text they came from, so treat them like the documents
  builders: "a free, private vector store for a prototype RAG or agent app, moved to a bigger machine later without changing the code"
  machine: memory grows with the collection; fast disk
  cards: []
  find: "GitHub repositories tagged vector-database, most starred and recently updated (Weaviate, Qdrant, Milvus, Chroma), and Postgres with pgvector when the app already uses Postgres"
  ask: ["how many documents or vectors, roughly?", "what will call it, and from where?"]

- category: AI chatbots for customers and communities
  source: edgible
  jobs: [a chatbot for my website, an AI that answers customer questions from our docs, a support bot, "an AI bot for our Discord, Slack, or Telegram"]
  replaces: [Intercom Fin, Chatbase, Tidio, Botpress Cloud, Voiceflow]
  drivers: [cost, control, privacy]
  fit: {rating: conditional, why: "the public talks to it, so it must stay up and its model costs must be capped; a hosted chatbot is often simpler for a small business"}
  exposure:
    default: "the chat widget or bot webhook on none, because the public and chat platforms cannot sign in; the admin and knowledge base on org; set a spending limit on any paid model API, and rate limits in the app"
    sensitive: "the same, with only public information in its knowledge base: anything the bot can read, a visitor can get it to say"
    regulated: "do not let it answer from client, patient, or financial records; send those questions to a person"
  permissions: "a public bot answers anyone, so its knowledge base must hold only what anyone may see"
  machine: always on, so usually a small cloud server; a GPU only for a local model
  cards: [n8n]
  find: "awesome-selfhosted's GenAI category, and GitHub repositories tagged chatbot or rag with a website widget or chat-platform integration (for example Dify, Flowise, Typebot)"
  ask: ["who will talk to it: customers, members, or your team?", "which model: a hosted API with a spending limit, or a local one?"]

